<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Loja</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="navbar-brand">RadarVendas</a>
        <button class="hamburger" id="hamburger-btn" aria-label="Abrir menu">☰</button>
        <nav class="navbar-menu" id="navbar-menu">
            <a href="index.html">Home</a>
            <a href="perfil.html" id="nav-perfil" style="display: none;"></a>
            <a href="#" id="nav-dinamico" style="display: none;"></a>
            <a href="login.html" id="nav-auth">Entrar</a>
        </nav>
    </header>

    <main class="container-loja">
        <section class="cabecalho-loja">
            <h2 id="nome-loja-gerenciamento"></h2>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <a href="painel.html" class="btn-secundario">Adicionar Produto</a>
                <a href="gerenciarEncontros.html" class="btn-secundario">Locais de Encontro</a>
                <a id="link-ver-loja" href="#" class="btn-login">Ver Página Pública</a>
            </div>
        </section>

        <section class="card-login" style="max-width: 100%; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: flex-end;">
            <div style="flex-grow: 1;">
                <label class="label-form" for="novo-nome-loja">Renomear Loja:</label>
                <input type="text" id="novo-nome-loja" class="campo-form" style="margin: 0;" placeholder="Novo nome da loja">
            </div>
            <button id="btn-renomear-loja" class="btn-padrao" style="margin: 0; height: fit-content;">Salvar Nome</button>
        </section>
        <section aria-labelledby="titulo-gerenciar-produtos">
            <h3 id="titulo-gerenciar-produtos">Meus Produtos Cadastrados</h3>
            <div id="lista-produtos-gerenciamento" class="grid-produtos" role="list">
            </div>
        </section>

        <div id="modal-editar-produto">
            <section class="card-login" id="modal-editar">
                <h2 style="margin-bottom: 1rem;">Editar Produto</h2>
                <form id="form-editar-produto">
                    <input type="hidden" id="edit-id">
                    
                    <label class="label-form">Título:</label>
                    <input type="text" id="edit-titulo" class="campo-form" required>

                    <label class="label-form">Categoria:</label>
                    <select id="edit-categoria" class="campo-form" required>
                        <option value="Doces">Doces</option>
                        <option value="Salgados">Salgados</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Acessório">Acessório</option>
                        <option value="Cosmético">Cosmético</option>
                        <option value="Artesanato">Artesanato</option>
                        <option value="Serviços">Serviços</option>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Papelaria">Papelaria</option>
                        <option value="Saudável">Saudável</option>
                    </select>

                    <label class="label-form">Preço (R$):</label>
                    <input type="number" id="edit-preco" class="campo-form" step="0.01" required>

                    <label class="label-form">Estoque Atual:</label>
                    <input type="number" id="edit-quantidade" class="campo-form" required>

                    <label class="label-form">Descrição:</label>
                    <textarea id="edit-descricao" class="campo-form" required></textarea>

                    <label class="label-form">Nova Foto (Deixe em branco para manter a atual):</label>
                    <input type="file" id="edit-foto" class="campo-form" accept="image/*">

                    <div id="modal-botoes">
                        <button type="submit" class="btn-padrao" style="flex: 1;">Salvar</button>
                        <button type="button" onclick="fecharModalEdicao()" class="btn-perigo" style="flex: 1;">Cancelar</button>
                    </div>
                </form>
            </section>
        </div>

    </main>

    <script src="js/auth-guard.js"></script>
    <script src="js/gerenciarLoja.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
